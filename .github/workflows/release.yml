name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate next version
        id: version
        run: |
          VERSION=$(node scripts/calculate-next-version.mjs || echo "")
          if [ -z "$VERSION" ]; then
            echo "No version bump needed, skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Next version: $VERSION"

      - name: Check if version already exists
        if: steps.version.outputs.skip == 'false'
        id: check-tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json and package-lock.json
        if: steps.version.outputs.skip == 'false' && steps.check-tag.outputs.exists == 'false'
        run: |
          node scripts/update-package-version.mjs "${{ steps.version.outputs.version }}"

      - name: Build
        if: steps.version.outputs.skip == 'false' && steps.check-tag.outputs.exists == 'false'
        run: npm run build

      - name: Get PR information
        if: steps.version.outputs.skip == 'false' && steps.check-tag.outputs.exists == 'false'
        id: pr-info
        run: |
          # Get the merge commit message to extract PR number
          MERGE_COMMIT=$(git log -1 --pretty=format:"%s")
          PR_NUMBER=$(echo "$MERGE_COMMIT" | grep -oP '#\K\d+' || echo "")

          if [ -n "$PR_NUMBER" ]; then
            PR_URL="https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            echo "has_pr=true" >> $GITHUB_OUTPUT
          else
            echo "pr_number=" >> $GITHUB_OUTPUT
            echo "pr_url=" >> $GITHUB_OUTPUT
            echo "has_pr=false" >> $GITHUB_OUTPUT
          fi

          # Get commit messages since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" --reverse)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --reverse)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Build release body
          RELEASE_BODY="## Changes"$'\n\n'"$COMMITS"$'\n\n'
          if [ "$PR_NUMBER" != "" ]; then
            RELEASE_BODY+="## Related PR"$'\n\n'"- PR #$PR_NUMBER: $PR_URL"$'\n\n'
          fi
          RELEASE_BODY+="---"$'\n\n'"This release was automatically created from merge to main."
          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create tag
        if: steps.version.outputs.skip == 'false' && steps.check-tag.outputs.exists == 'false'
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || exit 0
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin main --follow-tags

      - name: Create zip archive
        if: steps.version.outputs.skip == 'false' && steps.check-tag.outputs.exists == 'false'
        run: |
          cd out && zip -r ../danieltostes-com-v${{ steps.version.outputs.version }}.zip .

      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false' && steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.pr-info.outputs.release_body }}
          files: danieltostes-com-v${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
