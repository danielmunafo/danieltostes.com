name: Frontend

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'dev' || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Require recruiter API URL
        env:
          RECRUITER_API_URL: ${{ secrets.RECRUITER_API_URL || vars.RECRUITER_API_URL }}
          DEPLOY_ENV: ${{ github.event_name == 'pull_request' && 'dev' || 'production' }}
        run: |
          if [ -z "$RECRUITER_API_URL" ]; then
            echo "::error::RECRUITER_API_URL is unset for environment '$DEPLOY_ENV'. Add an environment secret (Settings → Environments → $DEPLOY_ENV), or a repository secret/variable."
            exit 1
          fi

      - name: Build
        env:
          NEXT_PUBLIC_RECRUITER_API_URL: ${{ secrets.RECRUITER_API_URL || vars.RECRUITER_API_URL }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY || vars.RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e:ci
        # smoke project only; recruiter match e2e runs in recruiter-api.yml

      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    environment: ${{ github.event_name == 'pull_request' && 'dev' || 'production' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download static output
        uses: actions/download-artifact@v4
        with:
          name: out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
