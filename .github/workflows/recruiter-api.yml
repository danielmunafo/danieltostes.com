name: Recruiter API

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/recruiter-api.yml"
      - "services/recruiter-assistant-api/**"
      - "e2e/**"
      - "evals/**"
      - "public/content/impact/**"
      - "public/content/recruiter-assistant/professional-context/**"
      - "src/features/recruiter-assistant/**"
      - "src/messages/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recruiter-api.yml"
      - "services/recruiter-assistant-api/**"
      - "e2e/**"
      - "evals/**"
      - "public/content/impact/**"
      - "public/content/recruiter-assistant/professional-context/**"
      - "src/features/recruiter-assistant/**"
      - "src/messages/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/recruiter-assistant-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Note retrieval eval skip for fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::Recruiter retrieval eval gate is skipped for fork PRs because OPENAI_API_KEY and AWS artifacts are not available to untrusted pull_request workflows."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/recruiter-assistant-api/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Prompt version-bump check
        env:
          PROMPT_MANIFEST_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:prompt-version-bump

      - name: Bundle Lambda
        run: npm run build

      - name: Zip artifact
        run: cd dist && zip -r "$GITHUB_WORKSPACE/function.zip" index.cjs

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-lambda-zip
          path: function.zip

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    environment: ${{ github.event_name == 'pull_request' && 'dev' || 'production' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Lambda zip
        uses: actions/download-artifact@v4
        with:
          name: recruiter-lambda-zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://function.zip \
            --publish

  rag-index:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    environment: ${{ github.event_name == 'pull_request' && 'dev' || 'production' }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: services/recruiter-assistant-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/recruiter-assistant-api/package-lock.json

      - name: Install
        run: npm ci

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
          DEPLOY_ENV: ${{ github.event_name == 'pull_request' && 'dev' || 'production' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is unset for environment '$DEPLOY_ENV'. Add an environment secret (Settings → Environments → $DEPLOY_ENV), or a repository secret/variable."
            exit 1
          fi

      - name: Build LlamaIndex corpus index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
        run: node scripts/build-llamaindex-index.mjs

      - name: Snapshot retrieval eval corpus
        run: npm run eval:snapshot

      - name: Retrieval eval gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
        run: npm run eval:retrieval

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload LlamaIndex index to S3
        run: |
          IDX_FILE=$(ls embeddings/llamaindex.v*.json | head -1)
          if [ -z "$IDX_FILE" ]; then
            echo "No embeddings/llamaindex.v*.json produced by build"
            exit 1
          fi
          BUCKET="${{ secrets.RECRUITER_EMBEDDINGS_BUCKET }}"
          aws s3 cp "$IDX_FILE" "s3://${BUCKET}/llamaindex-index.json"
          aws s3 cp "$IDX_FILE" "s3://${BUCKET}/$(basename "$IDX_FILE")"

      - name: Build and upload interests pack
        run: |
          if [ ! -f private/interests.source.md ]; then
            echo "Skipping interests pack (no private/interests.source.md in CI)"
            exit 0
          fi
          node scripts/build-interests-pack.mjs
          PACK_FILE=$(ls private/interests-pack.*.json | head -1)
          if [ -z "$PACK_FILE" ]; then
            echo "interests-pack build produced no JSON"
            exit 1
          fi
          BUCKET="${{ secrets.RECRUITER_EMBEDDINGS_BUCKET }}"
          aws s3 cp "$PACK_FILE" "s3://${BUCKET}/interests-pack.json"
          aws s3 cp "$PACK_FILE" "s3://${BUCKET}/$(basename "$PACK_FILE")"
